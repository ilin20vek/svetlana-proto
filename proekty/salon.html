<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bumaga:#fff;--chernila:#111;--seryy:#9a9691;--tonkaya:#ececea}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bumaga);color:var(--chernila);
  font-family:"Golos Text",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;width:100%}
:focus-visible{outline:1px solid var(--chernila);outline-offset:5px}

/* ТОЧКА-МЕНЮ */
.tochka{position:fixed;top:26px;right:34px;width:15px;height:15px;border-radius:50%;
  background:var(--chernila);z-index:60;cursor:pointer;border:0;padding:0;
  transition:transform .4s cubic-bezier(.25,.46,.45,.94)}
.tochka:hover{transform:scale(1.35)}
.tochka.otkryto{transform:scale(.6)}
.zanaves{position:fixed;inset:0;background:var(--bumaga);z-index:50;display:flex;
  align-items:center;justify-content:center;opacity:0;pointer-events:none;
  transition:opacity .45s}
.zanaves.vidno{opacity:1;pointer-events:auto}
.zanaves nav{display:flex;flex-direction:column;gap:18px;text-align:center}
.zanaves a{font-size:clamp(28px,4.4vw,54px);letter-spacing:.02em;font-weight:400;
  opacity:.35;transition:opacity .3s}
.zanaves a:hover{opacity:1}
.zanaves .svyaz{margin-top:36px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--seryy);opacity:1}

/* ПЕРВЫЙ ЭКРАН: два кадра и имя между ними */
.pervyy{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;
  gap:clamp(30px,6vw,90px);padding:clamp(50px,7vh,90px) 60px 40px;min-height:100vh}
.pervyy .levo{padding-top:0}
.pervyy .pravo{padding-top:clamp(70px,14vh,150px)}
/* Кадры вертикальные и крупные: у Shamshiri фотография - главное, а не поле. */
.pervyy .levo img,.pervyy .pravo img{aspect-ratio:4/5;object-fit:cover;background:#f3f1ee}
.stolb{display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  gap:26px;min-height:min(76vh,700px)}
.imya-vertikal{writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:clamp(34px,4.6vw,66px);letter-spacing:.34em;font-weight:400;line-height:1;
  text-transform:uppercase}
.pod-imenem{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--seryy);
  writing-mode:horizontal-tb;text-align:center;max-width:150px;line-height:2}
.spisok-vniz{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--seryy)}
.spisok-vniz:hover{color:var(--chernila)}

/* КОЛЛАЖ ПРОЕКТОВ */
.kollazh{padding:40px 60px 120px;display:grid;grid-template-columns:repeat(12,1fr);
  gap:clamp(40px,6vw,90px) 30px}
.rabota{display:block;position:relative}
.rabota img{background:#f3f1ee;transition:opacity .5s}
.rabota:hover img{opacity:.85}
.rabota .podpis{margin-top:12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--seryy)}
.rabota:hover .podpis{color:var(--chernila)}
/* Разные размеры и сдвиги: сетка не должна читаться как таблица. */
.rabota:nth-child(6n+1){grid-column:span 5}
.rabota:nth-child(6n+2){grid-column:span 4;margin-top:130px}
.rabota:nth-child(6n+3){grid-column:span 3;margin-top:40px}
.rabota:nth-child(6n+4){grid-column:span 4;margin-top:60px}
.rabota:nth-child(6n+5){grid-column:span 5;margin-top:0}
.rabota:nth-child(6n+6){grid-column:span 3;margin-top:150px}

/* ОБЫЧНЫЕ СТРАНИЦЫ */
.shapka-str{padding:34px 60px;display:flex;justify-content:space-between;align-items:baseline}
.shapka-str .znak{font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.shapka-str .nazad{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--seryy)}
.uzko{max-width:720px;margin:0 auto;padding:60px 30px 100px}
.uzko h1{font-size:clamp(30px,4vw,52px);font-weight:400;letter-spacing:-.01em;margin:0 0 34px;
  line-height:1.12}
.uzko h2{font-size:20px;font-weight:500;margin:44px 0 12px}
.uzko p{margin:0 0 20px;font-size:17px;line-height:1.72}
.uzko .melko{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--seryy);
  margin-bottom:16px}
.uzko img{margin:30px 0}
.spisok-strok div{padding:13px 0;border-bottom:1px solid var(--tonkaya);font-size:16px}

/* СТРАНИЦА ПРОЕКТА */
.zag-proekta{padding:70px 60px 26px;display:flex;justify-content:space-between;
  align-items:flex-end;gap:24px;flex-wrap:wrap}
.zag-proekta h1{font-size:clamp(28px,3.6vw,50px);font-weight:400;margin:0;letter-spacing:.01em}
.zag-proekta .sved{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--seryy)}
.kadry{padding:0 60px 60px;display:grid;grid-template-columns:repeat(12,1fr);gap:60px 30px}
.kadry figure{margin:0}
.kadry figure:nth-child(4n+1){grid-column:2 / span 7}
.kadry figure:nth-child(4n+2){grid-column:10 / span 3;align-self:end}
.kadry figure:nth-child(4n+3){grid-column:4 / span 6}
.kadry figure:nth-child(4n+4){grid-column:1 / span 4;margin-top:-60px}
.kadry img{background:#f3f1ee}
.sosedi{display:flex;justify-content:space-between;padding:50px 60px 90px;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.sosedi span{color:var(--seryy);display:block;margin-bottom:6px;font-size:10px}

@media (max-width:1000px){
  .pervyy{grid-template-columns:1fr;gap:34px;padding:70px 20px 40px;min-height:auto}
  .pervyy .pravo{padding-top:0}
  .stolb{flex-direction:row;align-items:center;justify-content:center;gap:18px;padding:10px 0}
  .imya-vertikal,.pod-imenem{writing-mode:horizontal-tb;transform:none}
  .imya-vertikal{font-size:34px;letter-spacing:.22em}
  .spisok-vniz{margin:0;padding-top:0}
  .kollazh{padding:20px;grid-template-columns:1fr;gap:44px}
  .rabota:nth-child(n){grid-column:auto;margin-top:0}
  .kadry{padding:0 20px 40px;grid-template-columns:1fr;gap:34px}
  .kadry figure:nth-child(n){grid-column:auto;margin-top:0}
  .zag-proekta,.shapka-str,.sosedi{padding-left:20px;padding-right:20px}
  .tochka{top:18px;right:20px}
}
</style>
</head><body>

<script>
const tochka = document.querySelector('.tochka');
const zanaves = document.querySelector('.zanaves');
tochka.addEventListener('click', () => {
  const otkryto = zanaves.classList.toggle('vidno');
  tochka.classList.toggle('otkryto', otkryto);
  tochka.setAttribute('aria-expanded', otkryto);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { zanaves.classList.remove('vidno'); tochka.classList.remove('otkryto'); }
});
</script>
